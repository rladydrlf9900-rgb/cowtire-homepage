<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 카우타이어</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<!--
  없는 주소로 들어왔을 때 Firebase Hosting 이 보여 주는 페이지.
  어느 깊이의 주소(/a/b/c)에서도 열리므로 로고·홈 링크는 / 로 시작하는 절대 경로로 쓴다.
  색·글꼴·버튼은 index.html 의 상단 줄(하늘색)·글자(#15202e)·.btn-main 에 맞춤.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#15202e;background:#fbfdff}
  a{color:inherit;text-decoration:none}
  .top{height:84px;background:linear-gradient(90deg,#3aaedd 0%,#5fc3ea 50%,#3aaedd 100%);border-bottom:3px solid #8fdcf5}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(120deg,#ffffff 0%,#eef9fe 40%,#ffffff 75%,#f3fbff 100%)}
  .box{text-align:center;max-width:520px}
  .mark{width:132px;height:132px;margin:0 auto;border-radius:50%;padding:6px;background:linear-gradient(135deg,#9fdcf4,#cdbff7 35%,#bdf2ea 65%,#9fdcf4);box-shadow:0 18px 40px rgba(120,190,230,.35)}
  .mark img{display:block;width:100%;height:100%;border-radius:50%;background:#fff;object-fit:contain;padding:14%}
  .code{margin-top:26px;font-size:18px;font-weight:900;letter-spacing:1.5px;color:#1f8fc7}
  h1{margin-top:10px;font-size:32px;font-weight:800;line-height:1.4;word-break:keep-all}
  p{margin-top:14px;font-size:19px;line-height:1.7;color:#5b5f72;word-break:keep-all}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:34px;padding:18px 34px;border-radius:999px;background:#15202e;color:#fff;font-weight:800;font-size:19px;box-shadow:0 14px 30px rgba(21,22,31,.18)}
  .btn:hover{background:#0b121c}
  @media (max-width:600px){h1{font-size:26px}p{font-size:17px}.btn{font-size:17px;padding:16px 28px}}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <div class="box">
    <div class="mark"><img src="/logo.jpg" alt="카우타이어"></div>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소를 확인하거나 홈으로 돌아가 주세요.</p>
    <a class="btn" href="/">카우타이어 홈으로 →</a>
  </div>
</main>
</body>
</html>
